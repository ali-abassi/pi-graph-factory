version: 1
factory: software-factory
model: openai-codex/gpt-5.6-luna

planner:
  harness: pi
  model: openai-codex/gpt-5.6-sol
  thinking: high
  instructions: agents/planner.md
  skills: [skills/planning, skills/repository-intelligence, skills/clear-prose]
  tools: [read, grep, find, ls, bash]
  timeout_seconds: 7200

plan_review:
  harness: pi
  model: openai-codex/gpt-5.6-sol
  thinking: high
  instructions: agents/plan_reviewer.md
  skills: [skills/clear-prose]
  tools: [read, grep, find, ls]
  min_score: 8.5
  max_cycles: 3
  timeout_seconds: 7200

intelligence:
  provider: graphify
  required: true
  auto_install: true
  enrichment:
    enabled: true
    required: false
    backend: deepseek
    model: deepseek-ai/DeepSeek-V4-Flash-0731
    mode: deep
    base_url: https://inference.baseten.co/v1
    pi_auth_model: baseten/deepseek-ai/DeepSeek-V4-Flash-0731

implementers:
  - id: product
    scope: Core product behavior and backend implementation
    harness: pi
    model: openai-codex/gpt-5.6-terra
    thinking: medium
    instructions: agents/implementer.md
    skills: [skills/implementation, skills/tdd, skills/diagnosing-bugs, skills/ponytail, skills/clear-prose]
    tools: [read, edit, write, bash]
    timeout_seconds: 14400
  - id: design
    scope: User interface and visual implementation
    harness: claude-code
    model: claude-sonnet-4-6
    thinking: medium
    instructions: agents/designer.md
    skills: [skills/design, skills/tdd, skills/diagnosing-bugs, skills/browser-proof, skills/ponytail, skills/clear-prose]
    tools: [read, edit, write, bash]
    timeout_seconds: 14400

review:
  harness: pi
  model: openai-codex/gpt-5.6-sol
  thinking: high
  instructions: agents/reviewer.md
  skills: [skills/review, skills/ponytail-review, skills/clear-prose]
  tools: [read, grep, find, ls, bash]
  max_cycles: 5
  timeout_seconds: 7200

evidence:
  policy: plan
  capture_commands:
    - python3 scripts/capture_factory_evidence.py
  screenshots:
    - evidence/factory/desktop.png
    - evidence/factory/mobile.png
  video: evidence/factory/flow.webm
  artifacts:
    - evidence/factory/browser-receipt.json
  test_commands:
    - git diff --check

limits:
  agent_timeout_seconds: 14400
  command_timeout_seconds: 3600
  termination_grace_seconds: 30
  max_total_tokens: null
  max_total_cost_usd: null
  require_usage: false

merge:
  target: main
  apply: false

delivery:
  enabled: false
  deploy_commands: []
  health_commands: []
  rollback_commands: []
