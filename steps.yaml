version: 1
workflow: software-factory
workers: 2
input:
  required: true
  description: One software change request
steps:
- id: plan
  needs: []
  cmd: python3 "$WORKFLOW_DIR/scripts/run_harness.py" --harness pi --model "openai-codex/gpt-5.6-sol"
    --instructions "agents/planner.md" --role "planner" --thinking high --tools "read,grep,find,ls"
    --skill "skills/planning" --input "$INPUT"
  schema:
    summary: string
    tasks: array
    acceptance: array
    risks: array
  gate: python3 -c "import json,os; x=json.load(open(os.environ['OUT'])); assert x['tasks']
    and x['acceptance']"
  retries: 1
- id: implement-product
  needs:
  - plan
  cmd: python3 "$WORKFLOW_DIR/scripts/run_harness.py" --harness pi --model "openai-codex/gpt-5.6-terra"
    --instructions "agents/implementer.md" --role "implementer:product" --thinking
    medium --tools "read,edit,write,bash" --skill "skills/implementation" --plan "$RUN/plan.md"
    --scope "Core product behavior and backend implementation" --workspace "product"
  schema:
    status:
      type: string
      enum:
      - pass
    changed_files: array
    checks: array
    summary: string
  gate: python3 -c "import json,os; x=json.load(open(os.environ['OUT'])); assert x['status']=='pass'
    and x['changed_files'] and x['checks']"
  retries: 1
- id: implement-design
  needs:
  - plan
  cmd: python3 "$WORKFLOW_DIR/scripts/run_harness.py" --harness claude-code --model
    "claude-sonnet-4-6" --instructions "agents/designer.md" --role "implementer:design"
    --thinking medium --tools "read,edit,write,bash" --skill "skills/design" --plan
    "$RUN/plan.md" --scope "User interface and visual implementation" --workspace
    "design"
  schema:
    status:
      type: string
      enum:
      - pass
    changed_files: array
    checks: array
    summary: string
  gate: python3 -c "import json,os; x=json.load(open(os.environ['OUT'])); assert x['status']=='pass'
    and x['changed_files'] and x['checks']"
  retries: 1
- id: integrate
  needs:
  - implement-product
  - implement-design
  cmd: python3 "$WORKFLOW_DIR/scripts/integrate.py" --run "$RUN" --out "$OUT"
  schema:
    status:
      type: string
      enum:
      - pass
    lanes: array
    changed_files: array
  gate: python3 -c "import json,os; x=json.load(open(os.environ['OUT'])); assert x['status']=='pass'
    and x['changed_files']"
- id: capture-1
  needs:
  - integrate
  cmd: python3 "$WORKFLOW_DIR/scripts/capture_evidence.py" --cycle 1 --config "$WORKFLOW_DIR/factory.yaml"
    --out "$OUT"
  schema:
    status:
      type: string
      enum:
      - pass
    screenshots: array
    video: string
    tests: array
  gate: python3 -c "import json,os; x=json.load(open(os.environ['OUT'])); assert x['status']=='pass'
    and x['tests']"
- id: review-1
  needs:
  - capture-1
  cmd: python3 "$WORKFLOW_DIR/scripts/run_harness.py" --harness pi --model "openai-codex/gpt-5.6-sol"
    --instructions "agents/reviewer.md" --role "reviewer:cycle-1" --thinking high
    --tools "read,grep,find,ls,bash" --skill "skills/review" --plan "$RUN/plan.md"
    --evidence "$RUN/capture-1.md" --cycle 1
  schema:
    verdict:
      type: string
      enum:
      - pass
      - repair
    issues: array
    evidence: array
  gate: python3 -c "import json,os; x=json.load(open(os.environ['OUT'])); assert x['verdict']
    in ('pass','repair') and x['evidence']"
- id: repair-1
  needs:
  - review-1
  from: review-1
  when:
    op: equals
    path: /verdict
    value: repair
  cmd: python3 "$WORKFLOW_DIR/scripts/run_harness.py" --harness pi --model "openai-codex/gpt-5.6-terra"
    --instructions "agents/implementer.md" --role "repairer:cycle-1" --thinking medium
    --tools "read,edit,write,bash" --skill "skills/implementation" --review "$RUN/review-1.md"
    --cycle 1 --workspace repair-1
  schema:
    status:
      type: string
      enum:
      - pass
    addressed: array
    checks: array
  gate: python3 -c "import json,os; x=json.load(open(os.environ['OUT'])); assert x['status']=='pass'
    and x['addressed'] and x['checks']"
- id: capture-2
  needs:
  - repair-1
