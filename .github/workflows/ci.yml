name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install factory and public Core release
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/ali-abassi/agent-workflows.git@v0.2.0"
      - name: Lint
        run: python -m ruff check scripts tests
      - name: Test factory contract
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m py_compile scripts/*.py tests/*.py
      - name: Compile and validate Pi Graph policy
        run: |
          python scripts/compile_factory.py factory.yaml \
            --out "$RUNNER_TEMP/factory.steps.yaml"
          piw doctor --json
          piw validate "$RUNNER_TEMP/factory.steps.yaml" --strict --json
